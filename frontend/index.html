<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0D0E11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Orkpad — App open source para freelancers</title>
    <meta name="description" content="Orkpad is the open-source app for freelancers. CRM, projects, time tracking, and billing — in one place, under your control." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://orkpad.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Orkpad" />
    <meta property="og:title" content="Orkpad — Open-source app for freelancers" />
    <meta property="og:description" content="Self-host your freelance business. CRM, projects, time tracking, and billing — in one open-source place." />
    <meta property="og:url" content="https://orkpad.com/" />
    <meta property="og:image" content="https://orkpad.com/og-image.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Orkpad — Open-source app for freelancers" />
    <meta name="twitter:description" content="Self-host your freelance business. CRM, projects, time tracking, and billing — in one open-source place." />
    <meta name="twitter:image" content="https://orkpad.com/og-image.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Orkpad",
        "url": "https://orkpad.com/",
        "description": "Orkpad is the open-source app for freelancers. CRM, projects, time tracking, and billing in one self-hostable place.",
        "publisher": {
          "@type": "Organization",
          "name": "Orkpad",
          "url": "https://orkpad.com/",
          "sameAs": "https://github.com/ignaciobecher/orkpad"
        }
      }
    </script>

    <!-- Preconnect to Font Origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://github.com">

    <!-- Google Fonts & Material Symbols (Non-blocking) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
