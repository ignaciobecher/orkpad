name: orkpad

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - orkpad
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
    env_file:
      # Single self-host config file (see .env.example). Optional here so
      # `docker compose config` still works before the first setup — the
      # required secrets below fail fast with a clear message instead.
      - path: .env
        required: false
    environment:
      # Override values that must point to the container network.
      MONGODB_URI: mongodb://mongo:27017/orkpad
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      API_URL: ${API_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Copy .env.example to .env and set JWT_REFRESH_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - orkpad

  frontend:
    build:
      context: ./frontend
      args:
        # Public URL the browser uses to reach the API. Keep the default for
        # local usage, or set it to your public URL when deploying.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - orkpad

volumes:
  mongo_data:

networks:
  orkpad:
